name: Tests

on:
  push:
  pull_request:

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
        lumen: [^8.3]

    name: P${{ matrix.php }} - L${{ matrix.lumen }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, json, simplexml, intl, pcntl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist --no-suggest

      - name: Execute Unit Tests
        run: vendor/bin/phpunit --testdox --testsuite Unit

      - name: Execute Functional Tests
        run: vendor/bin/phpunit --testdox --testsuite Functional
